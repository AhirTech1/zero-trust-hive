run:
  timeout: 3m
  tests: true
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - gofmt
    - goimports
    - nilerr
    - prealloc
    - unconvert
    - gosec
    - bodyclose
    - noctx

linters-settings:
  gosec:
    excludes:
      - G402  # TLS InsecureSkipVerify — intentional for self-signed ephemeral certs
  goimports:
    local-prefixes: github.com/AhirTech1/zero-trust-hive
  misspell:
    locale: US

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - noctx